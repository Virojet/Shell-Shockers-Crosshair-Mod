name: Track Repository Traffic

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  traffic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update cumulative traffic stats
        env:
          TRAFFIC_TOKEN: ${{ secrets.TRAFFIC_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python3 .github/scripts/traffic.py
      - name: Commit updated traffic badges
        run: |
          if ! git diff --quiet traffic/; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add traffic/
            git commit -m "chore(traffic): update traffic stats [skip ci]"
            git push
          fi
